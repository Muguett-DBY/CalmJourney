name: Refresh crowd data dry run

on:
  workflow_dispatch:
  schedule:
    # GitHub Actions schedules use UTC. This runs hourly for the MVP dry run.
    - cron: '0 * * * *'

jobs:
  refresh-crowd-dry-run:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.4.2'

      - name: Install R dependencies
        run: |
          Rscript -e "install.packages(c('data.table', 'httr2', 'janitor', 'jsonlite', 'lubridate', 'stringr'), repos = 'https://cloud.r-project.org')"

      - name: Run realtime crowd ETL in dry-run mode
        env:
          ETL_DRY_RUN: 'true'
        run: |
          Rscript etl/realtime-crowd/refresh_realtime_crowd.R
